name: Build and Release LiteWall IPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LiteWall IPK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package version
        id: pkg_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -E '^PKG_VERSION:=' Makefile | cut -d= -f2 | tr -d ' ')
          fi
          RELEASE=$(grep -E '^PKG_RELEASE:=' Makefile | cut -d= -f2 | tr -d ' ')
          PKG_NAME=$(grep -E '^PKG_NAME:=' Makefile | cut -d= -f2 | tr -d ' ')
          FULL_VER="${VERSION}-${RELEASE}"
          echo "pkg_name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "full_ver=${FULL_VER}" >> $GITHUB_OUTPUT
          echo "Building ${PKG_NAME} version ${FULL_VER}"

      - name: Assemble and Build IPK Package
        run: |
          PKG_DIR="ipk_stage"
          BUILD_TMP="build_tmp"
          rm -rf "$PKG_DIR" "$BUILD_TMP" bin
          mkdir -p "$PKG_DIR/CONTROL" "$PKG_DIR/etc" "$PKG_DIR/usr" "$PKG_DIR/www" "$BUILD_TMP" bin

          # Copy filesystem assets
          cp -r root/* "$PKG_DIR/"
          cp -r htdocs/* "$PKG_DIR/www/"

          # Ensure execute permissions on daemons and scripts
          chmod +x "$PKG_DIR"/etc/init.d/*
          chmod +x "$PKG_DIR"/etc/uci-defaults/*
          chmod +x "$PKG_DIR"/usr/share/xray-rust/*.sh
          chmod +x "$PKG_DIR"/usr/share/xray-rust/*.lua

          # Control metadata file
          printf "%s\n" \
            "Package: ${{ steps.pkg_info.outputs.pkg_name }}" \
            "Version: ${{ steps.pkg_info.outputs.full_ver }}" \
            "Depends: luci-base, lua, luci-lib-jsonc, nftables, curl" \
            "Architecture: all" \
            "Maintainer: Dan" \
            "Section: luci" \
            "Priority: optional" \
            "Description: LuCI support for LiteWall (Xray-Rust transparent proxy client)" \
            > "$PKG_DIR/CONTROL/control"

          # Post-installation hook
          printf "%s\n" \
            "#!/bin/sh" \
            '[ -n "$IPKG_INSTROOT" ] || {' \
            '    ( . /etc/uci-defaults/luci-app-xray-rust ) && rm -f /etc/uci-defaults/luci-app-xray-rust' \
            '    exit 0' \
            '}' \
            > "$PKG_DIR/CONTROL/postinst"
          chmod +x "$PKG_DIR/CONTROL/postinst"

          # Pre-removal hook
          printf "%s\n" \
            "#!/bin/sh" \
            '[ -n "$IPKG_INSTROOT" ] || {' \
            '    /etc/init.d/xray-rust stop >/dev/null 2>&1' \
            '    /etc/init.d/xray-rust disable >/dev/null 2>&1' \
            '    exit 0' \
            '}' \
            > "$PKG_DIR/CONTROL/prerm"
          chmod +x "$PKG_DIR/CONTROL/prerm"

          # 1. Pack data.tar.gz
          (cd "$PKG_DIR" && tar --owner=0 --group=0 --numeric-owner --exclude=CONTROL -czf "../$BUILD_TMP/data.tar.gz" .)

          # 2. Append Installed-Size to control and pack control.tar.gz
          INSTALLED_SIZE=$(gzip -dc "$BUILD_TMP/data.tar.gz" | wc -c)
          echo "Installed-Size: $INSTALLED_SIZE" >> "$PKG_DIR/CONTROL/control"
          (cd "$PKG_DIR/CONTROL" && tar --owner=0 --group=0 --numeric-owner -czf "../../$BUILD_TMP/control.tar.gz" .)

          # 3. Create debian-binary
          echo "2.0" > "$BUILD_TMP/debian-binary"

          # 4. Create final .ipk archive
          IPK_FILE="bin/${{ steps.pkg_info.outputs.pkg_name }}_${{ steps.pkg_info.outputs.full_ver }}_all.ipk"
          (cd "$BUILD_TMP" && tar --owner=0 --group=0 --numeric-owner -czf "../$IPK_FILE" ./debian-binary ./control.tar.gz ./data.tar.gz)

          rm -rf "$PKG_DIR" "$BUILD_TMP"
          ls -lh bin/

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg_info.outputs.pkg_name }}_${{ steps.pkg_info.outputs.full_ver }}_all
          path: bin/*.ipk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.ipk
          generate_release_notes: true
